      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#244f7a"/>
    </linearGradient>
    <linearGradient id="moheGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e7619"/>
