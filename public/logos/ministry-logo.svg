  <circle cx="140" cy="111" r="4" fill="#c59b27"/>
  <!-- Label -->
  <text x="100" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16324f">وزارت تحصیلات عالی</text>
  <text x="100" y="153" text-anchor="middle" font-family="serif" font-size="8.5" font-weight="700" fill="#244f7a" letter-spacing="0.8">MoHE AFGHANISTAN</text>
