  </defs>
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#moheGold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#moheNavy)" stroke-width="10"/>
  <circle cx="100" cy="100" r="72" fill="#f8fafc" stroke="url(#moheGold)" stroke-width="2"/>
